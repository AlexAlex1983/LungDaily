# LungDaily — main settings
site:
  name: "LungDaily"
  tagline: "The Pulse of Respiratory Health"
  description: "Daily news, study breakdowns and expert voices from the global lung health community."
  base_url: "https://lungdaily.org"
  custom_domain: "lungdaily.org"
  language: "en"
  contact_email: "editor@lungdaily.org"
  x_handle: "LungDaily"                # the site's own X account (without @)
  telegram_channel: ""                        # e.g. @lungdaily

models:
  triage: "claude-haiku-5-5"      # cheap: scores every collected item
  writer: "claude-sonnet-5-5"     # writes the articles
  checker: "claude-sonnet-5-5"    # independent fact-check of each article
  max_tokens: 1500
  triage_max_tokens: 8000         # triage scores a whole batch in one reply; too low = cut-off JSON

sources:
  x: true
  linkedin_profiles: true         # Apify, no LinkedIn login needed
  linkedin_search: false          # Apify keyword search — needs a LinkedIn li_at cookie (use a separate account)
  pubmed: true
  rss: true

limits:
  x_max_results_per_query: 50     # X pay-per-use: each tweet read costs credits
  x_max_queries_per_run: 6
  linkedin_max_posts_per_profile: 5
  linkedin_search_max_results: 25
  pubmed_max: 40
  rss_max_per_feed: 15
  triage_batch_size: 15
  min_score: 7                    # 0–10; items below this are dropped
  max_articles_per_run: 6         # articles WRITTEN per write run (they wait in the ready queue)
  max_articles_per_day: 20        # articles written per day (16 slots + a little spare)
  max_item_age_hours: 72

selection:                        # how the best items are chosen each run
  max_per_author_per_run: 1       # one article per account/author per run
  max_per_author_per_day: 2       # so a prolific journal or society cannot fill the site
  person_boost: 0.5               # individuals rank slightly above organisations at equal score
  category_boost:                 # help under-served sections
    people: 1.0
    approvals: 1.0
  min_score_by_category:          # lower bar for these sections (others use limits.min_score)
    people: 6
    approvals: 6

publishing:
  auto_publish: true              # false = everything goes to the held queue for you to release
  require_checker_pass: true      # articles failing the fact-check are held, never published
  min_body_words: 90
  max_body_words: 320
  # Scheduled publishing: one article per slot (local time below). Write runs (6x/day) fill a
  # ready queue; publish runs put out ONE article each. Remove `slots` to publish straight away.
  timezone: "Europe/Berlin"       # CET/CEST
  slots: ["07:00", "09:00", "10:00", "10:30", "11:00", "11:30", "11:45", "14:00",
          "15:00", "15:30", "16:00", "16:30", "16:45", "17:30", "18:00", "21:00"]
  # Write runs (collect + write into the ready queue), local time. Started by slot-clock.yml.
  write_times: ["06:07", "09:07", "12:07", "15:07", "18:07", "21:07"]
  ready_buffer: 6                 # write runs top the ready queue up to this many articles
  ready_max_age_hours: 36         # ready articles older than this are dropped (status "expired")

# Pictures for articles without an editor picture: original illustrations from content/library
# (drawn by scripts/make_picture_library.py; no photos, no people), matched to the topic and rotated.
pictures:
  library: true                   # false = always the plain branded card
  library_share: 0.75             # share of articles that get an illustration; the rest keep the plain card

amplify:
  x_post: true                    # post each article from the site's X account
  x_quote_source_tweet: true      # for X-sourced items, quote the original post (author gets notified)
  x_mention_authors: true         # tag the source author, accounts they tagged, and followed voices named in the article
  x_max_mentions: 3               # at most this many @tags per post
  x_hashtags: 2                   # topic hashtags per post (#COPD, #Asthma...), 0 to switch off
  linkedin_post: true             # post new articles on the LungDaily LinkedIn page, after deploy (via Make: MAKE_LINKEDIN_WEBHOOK)
  linkedin_max_per_day: 8         # keeps Make's free plan (about 1,000 operations/month) in range
  linkedin_window_hours: 36       # only articles published within this window are shared
  linkedin_org_id: "146950505"    # LungDaily LinkedIn page (linkedin.com/company/146950505)
  linkedin_reshare_source: true   # LinkedIn-sourced articles: repost the original (shows author photo + their visual)
  linkedin_hashtags: 3            # topic hashtags per LinkedIn post (clickable)
  linkedin_max_mentions: 3        # organisations tagged per LinkedIn post (needs linkedin_id in voices.yaml)
  linkedin_api_version: "202610"  # LinkedIn-Version header (YYYYMM); LinkedIn retires versions after ~1 year
  telegram_post: false
  telegram_admin_report: false    # run report to your private chat: published + held items

follow:
  enabled: true
  per_run: 10                     # accounts followed per run (runs every 6 hours)
  max_per_day: 40                 # hard cap over any 24 hours; on an X limit error: pause 24 h, then halve per_run
  min_followers: 300              # ignore very small accounts
  exclude: ["KulikovUNIATF"]      # never follow these
  unfollow: ["KulikovUNIATF", "imdat_eroglu", "DPedropaulo", "TKato_Thoracic"]   # one-off clean-up (done once)
