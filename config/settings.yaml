# LungDaily — main settings
site:
  name: "LungDaily"
  tagline: "The Pulse of Respiratory Health"
  description: "Daily news, study breakdowns and expert voices from the global lung health community."
  base_url: "https://lungdaily.org"
  custom_domain: "lungdaily.org"
  language: "en"
  contact_email: "editor@lungdaily.org"
  x_handle: "LungDaily"                # the site's own X account (without @)
  linkedin_url: "https://www.linkedin.com/company/146950505"   # shown in the site header/footer
  bluesky_handle: "lungdaily.bsky.social"                          # e.g. lungdaily.bsky.social — shows Bluesky links on the site
  telegram_channel: ""                        # e.g. @lungdaily
  # Search engines: paste the verification code (content="...") from Google Search Console /
  # Bing Webmaster Tools ("HTML tag" method), then run the `build` action. Leave "" until then.
  google_site_verification: "_OQtKBw-sX8J644KtOXjlR_Xs5a3vBs09_MCnJu_1Qw"
  bing_site_verification: ""
  # Visitor counts: GoatCounter (free, no cookies, no consent banner). Sign up at goatcounter.com,
  # choose a code (e.g. "lungdaily" -> lungdaily.goatcounter.com) and put it here. "" = off.
  goatcounter: "lungdaily"
  same_as:                                   # official profiles, for the Google logo/knowledge panel markup
    - "https://x.com/LungDaily"
    - "https://www.linkedin.com/company/146950505"
    - "https://bsky.app/profile/lungdaily.bsky.social"

models:
  triage: "claude-haiku-5-5"      # cheap: scores every collected item
  writer: "claude-sonnet-5-5"     # writes the articles
  checker: "claude-sonnet-5-5"    # independent fact-check of each article
  translator: "claude-sonnet-5-5" # newsletter language editions (es, fr, pt, ru)
  translator_max_tokens: 6000
  scout: "claude-sonnet-5-5"      # web-search news scout
  scout_max_tokens: 6000
  max_tokens: 1500
  triage_max_tokens: 8000         # triage scores a whole batch in one reply; too low = cut-off JSON

sources:
  x: true
  x_hours: [6, 12, 18]           # keyword/People X searches only at these write runs (local); voices are read every write run (21 Nov 2026)
  linkedin_profiles: true         # Apify (harvestapi~linkedin-profile-posts), no LinkedIn login needed
  linkedin_all_hours: [6, 15]     # read ALL voices' LinkedIn at these local hours; focus voices at every write run
  linkedin_search: false          # Apify keyword search — needs a LinkedIn li_at cookie (use a separate account)
  pubmed: true
  rss: true
  digest: true                    # LungDaily picks from the editor's 08:00/15:00 digest (content/digest/*.json)
  web_search: false               # own Claude web-search scout (API cost) — off while the digest feeds us
  web_search_hours: [6, 15]       # local hours it runs (each run ~8 searches)

web_search:
  lookback_hours: 48
  max_searches: 8                 # web searches per run ($10 per 1,000 searches + tokens)
  max_items: 12
  extra_topics: []
  topics: [copd, asthma, air_pollution, lung_cancer]   # digest + web-search picks outside these are ignored

figures:                          # one data figure (chart/graph/map) from openly licensed source pages
  enabled: true
  min_width: 500
  public_domain_domains: [cdc.gov, epa.gov, cancer.gov, fda.gov]   # not nih.gov: PubMed/PMC host publishers' figures

limits:
  x_max_results_per_query: 25     # X pay-per-use: each tweet read costs credits (halved 18 Nov 2026: was 50)
  x_max_queries_per_run: 6
  x_max_results_by_kind:          # per query kind (voices / keywords / people); others use the line above
    people: 10                    # People search: ~10 reads x 6 runs a day (was 20)
    awareness: 10                 # awareness-day hashtag search (was 20) (only in the days around each day)
  linkedin_max_posts_per_profile: 3   # last 24 h only; Apify charges per post
  linkedin_search_max_results: 25
  pubmed_max: 40
  rss_max_per_feed: 15
  google_news_gap_seconds: 6       # space Google News requests (they returned 429 in bursts)
  google_news_retry_seconds: 45    # one retry after a 429
  triage_batch_size: 15
  min_score: 6.5                  # 0–10; items below this are dropped (was 7: too few articles)
  max_articles_per_run: 6         # articles WRITTEN per write run (they wait in the ready queue)
  max_articles_per_day: 20        # articles written per day (16 slots + a little spare)
  max_item_age_hours: 72

selection:                        # how the best items are chosen each run
  max_per_author_per_run: 1       # one article per account/author per run
  max_per_author_per_day: 2       # so a prolific journal or society cannot fill the site
  max_per_author_per_week:        # rolling 7 days, by X handle (articles written from this account's posts)
    KulikovUNIATF: 2
  person_boost: 1.0               # individuals rank above organisations at equal score (feature more people)
  linkedin_boost: 0.5             # LinkedIn-sourced items rank a little higher (LinkedIn first: that's where the community is)
  focus_boost: 1.5                # voices.yaml focus: true (José Luis Castro, Tonya Winders) rank well above others
  focus_min_score: 6              # ...and need only score 6 to be written (others 6.5)
  voice_min_score: 6              # X posts from any voices.yaml account need only score 6 (21 Nov 2026: X items had dried up)
  digest_boost: 1.5               # picks from the editor's 08:00/15:00 digest rank well up
  digest_min_score: 5             # ...and need only score 5 (they were already hand-picked by topic)
  awareness_boost: 1.0            # items about an awareness day in its window (config/awareness.yaml)
  category_boost:                 # help under-served sections
    people: 1.0
    approvals: 1.0
  min_score_by_category:          # lower bar for these sections (others use limits.min_score)
    people: 6
    approvals: 6

publishing:
  auto_publish: true              # false = everything goes to the held queue for you to release
  require_checker_pass: true      # articles failing the fact-check are held, never published
  min_body_words: 90
  # Quality before quantity: sources thinner than this (words of real text, title excluded) are not
  # written up at all — an empty slot is better than a thin article. News feeds get the page text first.
  min_source_words: {rss: 60, pubmed: 60, x: 12, linkedin: 15}
  min_body_words_by_category:     # People items (appointments, awards) are short briefs
    people: 50
  max_body_words: 380             # writer aims for 110-280; small overruns are fine
  # Scheduled publishing: one article per slot (local time below). Write runs (6x/day) fill a
  # ready queue; publish runs put out ONE article each. Remove `slots` to publish straight away.
  timezone: "Europe/Berlin"       # CET/CEST
  slots: ["07:00", "09:00", "10:00", "10:30", "11:00", "11:30", "11:45", "14:00",
          "15:00", "15:30", "16:00", "16:30", "16:45", "17:30", "18:00", "21:00"]
  # Write runs (collect + write into the ready queue), local time. Started by slot-clock.yml.
  write_times: ["06:07", "09:07", "12:07", "15:27", "18:07", "21:07"]   # 15:27: the afternoon digest email arrives ~15:10–15:16
  ready_buffer: 6                 # write runs top the ready queue up to this many articles
  ready_max_age_hours: 36         # ready articles older than this are dropped (status "expired")

# Pictures for articles without an editor picture: original illustrations from content/library
# (drawn by scripts/make_picture_library.py; no photos, no people), matched to the topic and rotated.
pictures:
  library: true                   # false = always the plain branded card
  library_share: 1.0              # share of articles that get an illustration; the rest keep the plain card

amplify:
  x_post: true                    # post each article from the site's X account
  x_quote_source_tweet: true      # for X-sourced items, quote the original post (author gets notified)
  x_mention_authors: true         # tag the source author, accounts they tagged, and followed voices named in the article
  x_max_mentions: 3               # at most this many @tags per post
  x_hashtags: 2                   # topic hashtags per post (#COPD, #Asthma...), 0 to switch off
  linkedin_post: true             # post new articles on the LungDaily LinkedIn page, after deploy (via Make: MAKE_LINKEDIN_WEBHOOK)
  linkedin_max_per_day: 11        # safety cap over any 24 h (~3 Make credits each); order: focus voices, people, taggable orgs, best score
  # One LinkedIn post at each of these local times (Slot clock starts a run then); missed slots catch up one per run.
  linkedin_slots: ["10:15", "10:45", "11:15", "11:45", "14:45", "15:15", "15:45", "16:15", "16:45", "17:15", "17:45"]
  linkedin_window_hours: 36       # only articles published within this window are shared
  linkedin_org_id: "146950505"    # LungDaily LinkedIn page (linkedin.com/company/146950505)
  linkedin_reshare_source: true   # LinkedIn-sourced articles: repost the original (shows author photo + their visual)
  linkedin_hashtags: 3            # topic hashtags per LinkedIn post (clickable)
  linkedin_max_mentions: 3        # pages/people tagged per LinkedIn post (voices.yaml linkedin_id / linkedin_person_urn)
  linkedin_tag_people: true       # true = also tag people (voices.yaml linkedin_person_urn + exact linkedin_name)
  linkedin_api_version: "202610"  # LinkedIn-Version header (YYYYMM); LinkedIn retires versions after ~1 year
  bluesky_post: true              # mirror articles to Bluesky (needs BLUESKY_HANDLE + BLUESKY_APP_PASSWORD secrets)
  bluesky_max_per_run: 3          # posted after deploy; at most this many per run (so a backlog trickles out)
  bluesky_window_hours: 36        # only articles published within this window
  bluesky_hashtags: 2
  telegram_post: false
  telegram_admin_report: false    # run report to your private chat: published + held items

# "You've been featured" notes to the press office of the organisation an article is based on
# (voices.yaml -> press_email). One per address per week at most. Opt-outs: optout.yaml -> emails.
featured_email:
  enabled: true
  send: true                      # false = preview only (listed in the run report); true = send (needs SMTP_* secrets)
  per_address_days: 7
  window_hours: 36
  from_name: "LungDaily"
  from_address: "editor@lungdaily.org"
  bcc: "editor@lungdaily.org"     # a copy of every note lands in the editor inbox
  smtp_host: "smtp-relay.brevo.com"   # Brevo (free plan, lungdaily.org authenticated 14 Nov 2026)
  smtp_port: 587                  # login + key are the SMTP_USER / SMTP_PASSWORD secrets

# Weekly newsletter "The Week in Respiratory Health" via Buttondown (.github/workflows/newsletter.yml, Fridays)
newsletter:
  enabled: true
  buttondown_username: "lungdaily"       # Buttondown username -> shows the sign-up form on the site; "" = no form
  mode: "draft"                   # draft = you review and press Send in Buttondown; send = goes out automatically
  top_n: 8                        # stories per issue
  min_score: 8                    # only stories scored 8+ (falls back if fewer than 5 qualify)
  languages: [es, fr, pt, ru]     # translated editions, created as drafts for subscribers tagged lang-xx ([] = off)
  congress_daily: true            # during ATS/ERS (awareness.yaml congresses): a daily congress email draft

# Twice-weekly LinkedIn round-up ("The Week So Far" Tue / "The Week in Review" Fri), EMAILED as a draft
# to the editor inbox; you tag the pages and post it yourself (.github/workflows/linkedin-digest.yml)
linkedin_digest:
  enabled: true
  days: [tue, fri]                # round-up days (Europe/Berlin); the workflow runs on these mornings
  to: "editor@lungdaily.org"
  max_items: 8
  min_score: 7                    # falls back to lower scores if fewer than 5 qualify
  max_days: 5                     # look back at most this far (normally: since the previous round-up)

follow:
  enabled: true
  per_run: 10                     # accounts followed per run (runs every 6 hours)
  max_per_day: 40                 # hard cap over any 24 hours; on an X limit error: pause 24 h, then halve per_run
  min_followers: 300              # ignore very small accounts
  exclude: ["KulikovUNIATF"]      # never follow these
  unfollow: ["KulikovUNIATF", "imdat_eroglu", "DPedropaulo", "TKato_Thoracic"]   # one-off clean-up (done once)
