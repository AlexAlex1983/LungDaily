# People and organisations to follow. Their posts are the core of "Voices".
# Seed list — verify each handle/URL and extend to 200–500 respiratory voices.
# Fields: name, x (handle without @), linkedin (profile or company URL), tier (1 = top), tags,
# aliases (other names used in articles, e.g. "ERS"). When an article names a voice, its X post tags them.

voices:
  - name: "World Health Organization"
    x: "WHO"
    aliases: ["WHO"]
    linkedin: "https://www.linkedin.com/company/world-health-organization/"
    tier: 1
    tags: [policy]
  - name: "European Respiratory Society"
    x: "ERSpublications"
    aliases: ["ERS"]
    linkedin: "https://www.linkedin.com/company/european-respiratory-society/"
    tier: 1
    tags: [society]
  - name: "American Thoracic Society"
    x: "atscommunity"
    aliases: ["ATS"]
    linkedin: ""
    tier: 1
    tags: [society]
  - name: "Alexey Kulikov"
    x: "KulikovUNIATF"
    aliases: ["Dr Alexey Kulikov"]
    linkedin: ""
    tier: 1
    tags: [policy, ncd]
