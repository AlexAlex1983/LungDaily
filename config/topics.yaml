# What counts as lung-health news.

categories:
  voices:    "Voices — what clinicians, researchers, advocates and organisations are saying"
  research:  "New Paper Alert — new studies and reviews"
  policy:    "Policy & Air — WHO/UN/national policy, air pollution, tobacco and vaping"
  approvals: "Approvals & Trials — regulatory decisions, trial readouts, new devices and drugs"
  people:    "People — appointments, awards, career moves"
  events:    "Events — congresses, webinars, calls for grants"

# Keyword query used for X and LinkedIn search (kept short: X query limit is 512 chars)
# Single quotes keep the inner double quotes, so multi-word terms are searched as exact phrases.
keywords:
  - 'COPD'
  - 'asthma'
  - '"lung cancer screening"'
  - 'bronchiectasis'
  - '"interstitial lung disease"'
  - '"pulmonary fibrosis"'
  - '("air pollution" lung)'
  - '"chronic respiratory"'
  - 'spirometry'
  - '"lung health"'

# X search for the People section (appointments, elections, awards, obituaries). The run adds
# "lang:en -is:retweet -is:reply". Keep under ~470 characters.
people_query: >-
  ("elected president" OR "named president" OR "new president" OR "president-elect" OR appointed
  OR "editor-in-chief" OR "lifetime achievement" OR "award winner" OR awarded OR honoured OR honored
  OR "in memoriam" OR "passed away") (respiratory OR pulmonary OR pulmonology OR pulmonologist
  OR thoracic OR COPD OR asthma OR "lung health" OR "lung cancer" OR tuberculosis)

pubmed_query: >-
  ("pulmonary disease, chronic obstructive"[MeSH] OR COPD[tiab] OR asthma[tiab]
  OR bronchiectasis[tiab] OR "interstitial lung disease"[tiab] OR "pulmonary fibrosis"[tiab]
  OR "lung cancer screening"[tiab] OR ("air pollution"[tiab] AND (lung[tiab] OR respiratory[tiab])))
  AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt]
  OR "Lancet"[ta] OR "N Engl J Med"[ta] OR "Eur Respir J"[ta] OR "Am J Respir Crit Care Med"[ta]
  OR "Lancet Respir Med"[ta] OR "Thorax"[ta] OR "Chest"[ta] OR "JAMA"[ta] OR "BMJ"[ta])

rss_feeds:
  - name: "WHO news"
    url: "https://www.who.int/rss-feeds/news-english.xml"
  - name: "Google News — COPD"
    url: "https://news.google.com/rss/search?q=COPD+when:2d&hl=en&gl=US&ceid=US:en"
  - name: "Google News — asthma"
    url: "https://news.google.com/rss/search?q=asthma+when:2d&hl=en&gl=US&ceid=US:en"
  - name: "Google News — lung cancer screening"
    url: "https://news.google.com/rss/search?q=%22lung+cancer+screening%22+when:2d&hl=en&gl=US&ceid=US:en"
  - name: "Google News — air pollution health"
    url: "https://news.google.com/rss/search?q=%22air+pollution%22+lungs+when:2d&hl=en&gl=US&ceid=US:en"
  # --- Approvals & Trials ---
  - name: "Google News — respiratory approvals"
    url: "https://news.google.com/rss/search?q=(FDA+OR+EMA+OR+CHMP+OR+MHRA)+(approves+OR+approval+OR+recommends)+(COPD+OR+asthma+OR+%22lung+cancer%22+OR+bronchiectasis+OR+%22pulmonary+fibrosis%22+OR+%22cystic+fibrosis%22+OR+RSV)+when:3d&hl=en&gl=US&ceid=US:en"
  - name: "Google News — respiratory trial results"
    url: "https://news.google.com/rss/search?q=(%22phase+3%22+OR+%22phase+III%22+OR+%22topline+results%22+OR+%22phase+2%22)+(COPD+OR+asthma+OR+bronchiectasis+OR+%22pulmonary+fibrosis%22+OR+%22lung+cancer%22)+when:3d&hl=en&gl=US&ceid=US:en"
  # --- People ---
  - name: "Google News — respiratory appointments"
    url: "https://news.google.com/rss/search?q=(appointed+OR+%22named+president%22+OR+%22elected+president%22+OR+%22new+CEO%22+OR+%22editor-in-chief%22)+(respiratory+OR+thoracic+OR+pulmonology+OR+%22lung+foundation%22+OR+%22lung+association%22)+when:7d&hl=en&gl=US&ceid=US:en"
  - name: "Bing News — respiratory appointments"
    url: "https://www.bing.com/news/search?q=(appointed+OR+%22named+president%22+OR+%22elected+president%22+OR+%22president-elect%22+OR+%22new+CEO%22+OR+%22editor-in-chief%22)+(respiratory+OR+thoracic+OR+pulmonology+OR+%22lung+association%22+OR+%22lung+foundation%22+OR+%22lung+cancer%22)&format=rss&qft=sortbydate%3d%221%22"
  - name: "Bing News — respiratory awards and obituaries"
    url: "https://www.bing.com/news/search?q=(award+OR+honoured+OR+honored+OR+obituary+OR+%22lifetime+achievement%22)+(pulmonologist+OR+%22respiratory+physician%22+OR+%22thoracic+society%22+OR+%22lung+researcher%22+OR+%22respiratory+society%22)&format=rss&qft=sortbydate%3d%221%22"
  - name: "Google News — respiratory awards"
