# Caregivers space: /caregivers/ — practical guides from trusted lung-health organisations for people
# who look after someone with a lung condition, plus LungDaily news that matters to families.
# LungDaily does not write its own medical advice here: every guide links to the organisation's own page.
# URLs checked 27 Nov 2026. Add only pages from established patient organisations, societies or WHO.

intro: >-
  Looking after someone with a lung condition — a parent with COPD, a partner with pulmonary fibrosis,
  a child with asthma — is demanding. This page brings together practical guides from trusted lung
  health organisations, and the news that matters to families and carers.
safety: >-
  This page links to information; it is not medical advice. If someone's breathing suddenly gets much
  worse, their lips or face turn blue or grey, or they are too breathless to speak, call your local
  emergency number. For everything else, talk to their doctor, nurse or pharmacist.

