name: Pipeline

on:
  schedule:
    # 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 CET (05:00–20:00 UTC)
    - cron: "7 5,8,11,14,17,20 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "all = full run · release/discard = act on a held article · build = rebuild site only"
        type: choice
        options: [all, release, discard, build]
        default: all
      slug:
        description: "Article slug (for release/discard)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          ACTION="${{ github.event.inputs.action || 'all' }}"
          if [ "$ACTION" = "release" ] || [ "$ACTION" = "discard" ]; then
            python -m lungdaily.run "$ACTION" "${{ github.event.inputs.slug }}"
            python -m lungdaily.run build
          elif [ "$ACTION" = "build" ]; then
            python -m lungdaily.run build
          else
            python -m lungdaily.run all
          fi

      - name: Save state and articles
        run: |
          git config user.name "lungdaily-bot"
          git config user.email "lungdaily-bot@users.noreply.github.com"
          git add data content
          git diff --cached --quiet || git commit -m "pipeline: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main && git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
