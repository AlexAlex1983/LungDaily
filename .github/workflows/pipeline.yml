name: Pipeline

on:
  schedule:
    # WRITE runs (collect + write into the ready queue): 06:07, 09:07, 12:07, 15:07, 18:07, 21:07 CET
    - cron: "7 5,8,11,14,17,20 * * *"
    # PUBLISH slots, one article each (UTC = CET-1; in summer time they fire 1 h later local):
    # 07:00 09:00 10:00 11:00 14:00 15:00 16:00 18:00 21:00 CET
    - cron: "0 6,8,9,10,13,14,15,17,20 * * *"
    # 10:30 11:30 15:30 16:30 17:30 CET
    - cron: "30 9,10,14,15,16 * * *"
    # 11:45 16:45 CET
    - cron: "45 10,15 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "all = full run · publish-slot = publish one ready article if a slot is due · write = collect + write into ready queue · release/discard = act on a held article · build = rebuild site only · linkedin-test = send one sample to Make · check-handles = look up X handles given in slug (comma-separated) · add-image = download image_url as the picture for slug, then build"
        type: choice
        options: [all, publish-slot, write, release, discard, build, linkedin-test, check-handles, add-image]
        default: all
      slug:
        description: "Article slug (for release/discard/add-image)"
        required: false
      image_url:
        description: "add-image: direct URL of a picture we have the right to use (jpg/png/webp)"
        required: false
      image_credit:
        description: "add-image: credit line shown under the picture, e.g. NASA Worldview"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          MAKE_LINKEDIN_WEBHOOK: ${{ secrets.MAKE_LINKEDIN_WEBHOOK }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          IN_SLUG: ${{ github.event.inputs.slug }}
          IN_IMAGE_URL: ${{ github.event.inputs.image_url }}
          IN_IMAGE_CREDIT: ${{ github.event.inputs.image_credit }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ]; then
            if [ "${{ github.event.schedule }}" = "7 5,8,11,14,17,20 * * *" ]; then ACTION=write; else ACTION=publish-slot; fi
          fi
          echo "Action: $ACTION"
          if [ "$ACTION" = "release" ] || [ "$ACTION" = "discard" ]; then
            python -m lungdaily.run "$ACTION" "${{ github.event.inputs.slug }}"
            python -m lungdaily.run build
          elif [ "$ACTION" = "check-handles" ]; then
            python -m lungdaily.run check-handles "${{ github.event.inputs.slug }}"
            python -m lungdaily.run build
          elif [ "$ACTION" = "linkedin-test" ]; then
            python -m lungdaily.run build
          elif [ "$ACTION" = "add-image" ]; then
            python -m lungdaily.run add-image "$IN_SLUG" "$IN_IMAGE_URL" "$IN_IMAGE_CREDIT"
            python -m lungdaily.run build
          elif [ "$ACTION" = "write" ] || [ "$ACTION" = "publish-slot" ]; then
            python -m lungdaily.run "$ACTION"
          elif [ "$ACTION" = "build" ]; then
            python -m lungdaily.run build
          else
            python -m lungdaily.run all
          fi

      - name: Save state and articles
        run: |
          git config user.name "lungdaily-bot"
          git config user.email "lungdaily-bot@users.noreply.github.com"
          git add data content
          git diff --cached --quiet || git commit -m "pipeline: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main && git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Share on LinkedIn (after deploy, so images are online)
        if: ${{ github.event.inputs.action != 'discard' }}
        env:
          MAKE_LINKEDIN_WEBHOOK: ${{ secrets.MAKE_LINKEDIN_WEBHOOK }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: |
          sleep 60
          if [ "${{ github.event.inputs.action }}" = "linkedin-test" ]; then
            python -m lungdaily.run linkedin-test
            exit 0
          fi
          python -m lungdaily.run linkedin
          git add content
          git diff --cached --quiet || git commit -m "linkedin: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main && git push
