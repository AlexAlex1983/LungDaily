name: Newsletter

# "The Week in Respiratory Health" — composed from the week's best articles and created in
# Buttondown (draft or sent, see settings.yaml -> newsletter). Fridays ~08:20 CET.
on:
  schedule:
    - cron: "19 7 * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: "Create it again even if this week's newsletter already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compose and create in Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -m lungdaily.run newsletter force
          else
            python -m lungdaily.run newsletter
          fi
      - name: Save state
        run: |
          git config user.name "lungdaily-bot"
          git config user.email "lungdaily-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "newsletter: $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main && git push
