name: Follow

on:
  schedule:
    # every 6 hours (00:41, 06:41, 12:41, 18:41 UTC)
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Follow
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python -m lungdaily.run follow
      - name: Save state
        run: |
          git config user.name "lungdaily-bot"
          git config user.email "lungdaily-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "follow: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main && git push
