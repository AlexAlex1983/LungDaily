name: LinkedIn digest

# Twice-weekly LinkedIn round-up draft ("The Week So Far" / "The Week in Review"), emailed to
# editor@lungdaily.org for review. Nothing is posted automatically. Tue + Fri ~07:37 CET.
on:
  schedule:
    - cron: "37 6 * * 2,5"
  workflow_dispatch:
    inputs:
      force:
        description: "Make it now even if it is not a round-up day / was already made today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compose and email the draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          F=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then F="force"; fi
          python -m lungdaily.run linkedin-digest $F
      - name: Save state
        run: |
          git config user.name "lungdaily-bot"
          git config user.email "lungdaily-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "linkedin-digest: $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main && git push
